server:
  port: 8081
spring:
  banner:
    location: classpath:banner.txt
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: true
    show-sql: true
  h2:
    console:
      enabled: true
      path: /db
  security:
    user:
      name: su
      password: 0123456789